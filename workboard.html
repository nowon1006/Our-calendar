<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 보드</title>
<script src="https://unpkg.com/solarlunar/dist/solarlunar.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f2d4f;
    --navy-2:#34466f;
    --ink:#1d2433;
    --sub:#6b7385;
    --bg:#f3f4f7;
    --card:#ffffff;
    --border:#e1e4ea;
    --line:#eceef2;
    --hover:#f5f7fb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gaegu',cursive;font-size:20px}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  .board{max-width:1600px;margin:0 auto;padding:32px;display:grid;grid-template-columns:minmax(0,6fr) minmax(0,4fr);grid-template-rows:auto auto auto;gap:20px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:22px 26px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .panel h2{font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--navy);margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--navy)}
  .cal{grid-row:1 / span 2;display:flex;flex-direction:column;padding:18px 20px}
  .memo{display:flex;flex-direction:column;min-height:360px}
  .links{grid-column:1 / span 2}

  /* ---------- 버튼 ---------- */
  .btn{background:var(--navy);border:1px solid var(--navy);color:#fff;border-radius:6px;padding:2px 14px;cursor:pointer;line-height:1.5;transition:background .12s}
  .btn:hover{background:var(--navy-2)}
  .btn.ghost{background:#fff;border-color:var(--border);color:var(--sub)}
  .btn.ghost:hover{background:var(--hover);color:var(--navy);border-color:#cfd4de}

  /* ---------- 캘린더 ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .cal-nav .btn{background:#fff;border-color:var(--border);color:var(--navy);padding:2px 10px}
  .cal-nav .btn:hover{background:var(--hover)}
  .cal-nav .ym{font-size:28px;font-weight:700;color:var(--navy);min-width:160px;text-align:center}
  .grid{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
  .grid .wd{background:#f6f7fa;color:var(--sub);text-align:center;padding:6px 0;font-weight:700;font-size:18px;border-bottom:1px solid var(--border)}
  .grid .wd:first-child{color:#b5413a}
  .grid .wd:nth-child(7){color:#33589e}
  .grid .day{min-height:126px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px;cursor:pointer;overflow:hidden;transition:background .1s}
  .grid .day:nth-child(7n){border-right:none}
  .grid .day:hover{background:var(--hover)}
  .grid .day.empty{background:#fafbfc;cursor:default}
  .day .top{display:flex;align-items:center;gap:4px;min-width:0;margin-bottom:1px}
  .num{flex:0 0 auto;font-weight:700;font-size:17px;display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:6px;color:var(--ink)}
  .day.holiday .num{color:#b5413a}
  .sub{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sub.holiday{color:#b5413a}
  .sub.observance{color:#2a8585}
  .sub.birthday{color:#2f6fd6}
  .sub.anniversary{color:#c2185b}
  .sub.lunar{color:var(--sub);font-weight:400}
  .day.sun .num{color:#b5413a}
  .day.sat .num{color:#33589e}
  .day.is-today{background:#f7f9fd}
  .day.is-today .num{background:var(--navy);color:#fff}
  .chip{display:block;white-space:nowrap;text-overflow:ellipsis;font-size:14px;line-height:1.3;padding:1px 4px;margin-top:2px;border-radius:3px;overflow:hidden;letter-spacing:-0.3px;color:var(--ink)}
  .day.few .chip{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;word-break:break-all}
  .chip.done{text-decoration:line-through;color:#8a91a0}
  .chip.done::before{content:'✓ ';text-decoration:none;display:inline}
  .more{font-size:14px;color:var(--sub);margin-top:2px}

  /* ---------- 체크박스 공통 ---------- */
  .ck{flex:0 0 auto;width:20px;height:20px;border:1.5px solid #b9bfcb;border-radius:4px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;padding:0;line-height:1;transition:all .12s}
  .ck:hover{border-color:var(--navy)}
  .ck.on{background:var(--navy);border-color:var(--navy)}
  .ck.on::after{content:'✓'}

  /* ---------- TODAY ---------- */
  .today-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--navy);margin-bottom:6px}
  .today-head h2{border:none;padding-bottom:10px;margin:0}
  .today-date{font-size:18px;color:var(--sub)}
  .todo-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:7px 2px}
  .todo-row input{flex:1;border:none;background:transparent;outline:none;font-size:21px;padding:2px 0}
  .todo-row input::placeholder{color:#b4b9c4}
  .todo-row.done input{text-decoration:line-through;color:#9aa0ad}
  .todo-row .del{border:none;background:none;color:#b4b9c4;cursor:pointer;font-size:20px;visibility:hidden}
  .todo-row .del:hover{color:#b5413a}
  .todo-row:hover .del{visibility:visible}
  .todo-actions{display:flex;gap:8px;margin-top:14px}

  /* ---------- MEMO ---------- */
  .memo textarea{flex:1;width:100%;border:none;background:transparent;resize:none;outline:none;font-size:21px;line-height:1.6;
    background-image:linear-gradient(transparent calc(1.6em - 1px), var(--line) calc(1.6em - 1px));background-size:100% 1.6em;background-attachment:local}
  .memo textarea::placeholder{color:#b4b9c4}

  /* ---------- 업무링크 ---------- */
  .link-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .lbox{position:relative;display:flex;align-items:center;justify-content:center;height:96px;background:#fff;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--ink);font-size:20px;line-height:1.4;cursor:pointer;transition:border-color .12s, box-shadow .12s, background .12s;padding:8px 22px}
  .lbox:hover{background:var(--hover);box-shadow:0 2px 8px rgba(16,24,40,.08);border-color:#cfd4de}
  .lbox.empty{border-style:dashed;background:#fafbfc}
  .lbox.empty::before{content:'+';color:#c3c8d2;font-size:26px}
  .lbox .nm{white-space:pre-line;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
  .lbox .pen{position:absolute;top:4px;right:6px;border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 4px;opacity:0;transition:opacity .12s}
  .lbox:hover .pen{opacity:1}
  .lbox .pen:hover{color:var(--navy)}
  .lbox.empty .pen{display:none}
  @media (hover:none){.lbox .pen{opacity:1}}

  /* ---------- 모달 ---------- */
  .modal{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .modal.open{display:flex}
  .sheet{background:#fff;border-radius:12px;padding:24px 26px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 20px 40px rgba(16,24,40,.18)}
  .sheet h3{margin:0 0 14px;font-size:26px;color:var(--navy);padding-bottom:10px;border-bottom:2px solid var(--navy)}
  .ev-list{list-style:none;padding:0;margin:0 0 14px}
  .ev-list li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .ev-list .txt{flex:1;padding:1px 8px;border-radius:4px;cursor:pointer;border:1.5px solid transparent}
  .ev-list .txt:hover{border-color:#cfd4de}
  .ev-list li.editing .txt{border-color:var(--navy)}
  .ev-list .grip{cursor:grab;touch-action:none;user-select:none;color:#b4b9c4;font-size:16px;letter-spacing:-3px;padding:0 4px}
  .ev-list .grip:hover{color:var(--navy)}
  .ev-list li.dragging{background:var(--hover);box-shadow:0 2px 8px rgba(16,24,40,.12);border-radius:6px}
  .ev-list li.dragging .grip{cursor:grabbing}
  .builtin{display:flex;align-items:center;gap:8px;background:#f6f7fa;border:1px dashed var(--border);border-radius:6px;padding:4px 10px;margin-bottom:6px}
  .builtin .bt{flex:1;font-weight:700}
  .builtin .bt.holiday{color:#b5413a}
  .builtin .bt.observance{color:#2a8585}
  .builtin .bt.birthday{color:#2f6fd6}
  .builtin .bt.anniversary{color:#c2185b}
  .builtin .btag{font-size:14px;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:10px;padding:0 8px}
  .ev-list li.done .txt{text-decoration:line-through;color:#8a91a0}
  .ev-list .x{border:none;background:none;color:#b4b9c4;cursor:pointer;font-size:20px}
  .ev-list .x:hover{color:#b5413a}
  .ev-empty{color:var(--sub);margin-bottom:14px}
  .field{resize:none;font-family:inherit;line-height:1.4;width:100%;border:1px solid var(--border);border-radius:6px;outline:none;padding:6px 10px;margin-bottom:12px;font-size:21px;background:#fff}
  .field:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,45,79,.1)}
  .cat-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .cat-pick button{border:1.5px solid transparent;border-radius:6px;padding:1px 12px;cursor:pointer;font-size:18px;color:var(--ink)}
  .cat-pick button.sel{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,45,79,.12)}
  .sheet .row{display:flex;gap:8px;justify-content:flex-end}
  .add-row{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
  .add-row .field{flex:1;margin-bottom:0}
  .add-row .btn{flex:0 0 auto;padding:0 18px}
  .ev-list .txt{user-select:none;-webkit-user-select:none}
  .lbl{font-size:16px;color:var(--sub);margin-bottom:4px}

  /* ---------- 동기화 상태 ---------- */
  .sync{position:fixed;right:16px;bottom:12px;font-size:15px;color:var(--sub);background:#fff;border:1px solid var(--border);border-radius:20px;padding:2px 12px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
  .sync.ok{color:#2e7d4f}
  .sync.err{color:#b5413a}

  @media (max-width:640px){
    .board{grid-template-columns:1fr;padding:14px}
    .cal,.links{grid-row:auto;grid-column:auto}
    .panel{padding:18px 14px}
    .grid .day{min-height:64px}
    .chip{font-size:12px}
    .link-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="board">

  <!-- 이달의 캘린더 -->
  <section class="panel cal">
    <div class="cal-head">
      <div class="cal-nav">
        <button class="btn" id="prevM">◀</button>
        <span class="ym" id="ym"></span>
        <button class="btn" id="nextM">▶</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 오늘일정 -->
  <section class="panel today">
    <div class="today-head"><h2>TODAY</h2><span class="today-date" id="todayDate"></span></div>
    <div id="todoList"></div>
    <div class="todo-actions">
      <button class="btn ghost" id="addTodo">+ 줄 추가</button>
      <button class="btn ghost" id="clearDone">완료 항목 지우기</button>
    </div>
  </section>

  <!-- 메모 -->
  <section class="panel memo">
    <h2>MEMO</h2>
    <textarea id="memo" placeholder="중요한 아이디어, 비번 등 메모"></textarea>
  </section>

  <!-- 업무링크 -->
  <section class="panel links" id="linksPanel">
    <h2>업무링크</h2>
    <div class="link-grid" id="linkGrid"></div>
  </section>
</div>

<div class="sync" id="syncStatus">연결 중…</div>

<!-- 날짜 일정 모달 -->
<div class="modal" id="dayModal">
  <div class="sheet">
    <h3 id="dmTitle"></h3>
    <div id="dmBuiltin"></div>
    <ul class="ev-list" id="dmList"></ul>
    <div class="ev-empty" id="dmEmpty">등록된 일정이 없어요</div>
    <div class="add-row">
      <input class="field" id="dmText" placeholder="일정 입력 후 Enter">
      <button class="btn" id="dmAdd">추가</button>
    </div>
    <div class="cat-pick" id="dmCats"></div>
    <div class="row">
      <button class="btn ghost" id="dmCancel">취소</button>
      <button class="btn" id="dmSave">저장</button>
    </div>
  </div>
</div>

<!-- 링크 편집 모달 -->
<div class="modal" id="linkModal">
  <div class="sheet">
    <h3>링크 설정</h3>
    <div class="lbl">이름 (Enter로 줄바꿈)</div>
    <textarea class="field" id="lmName" rows="2" placeholder="예: 마젠타룸&#10;어드민"></textarea>
    <div class="lbl">주소(URL)</div>
    <input class="field" id="lmUrl" placeholder="https://...">
    <div class="row">
      <button class="btn ghost" id="lmClear">비우기</button>
      <button class="btn ghost" data-close>취소</button>
      <button class="btn" id="lmSave">저장</button>
    </div>
  </div>
</div>

<script>
const KEY = 'workboard_v1';
const CATS = [
  {name:'마젠타룸', color:'#fff59d'}, // 연노랑
  {name:'릴스',     color:'#ffd6e0'}, // 연분홍
  {name:'러그홀릭', color:'#d6f5b8'}, // 연한연두
  {name:'드림오더', color:'#c6e8ff'}, // 하늘색
  {name:'기타1',    color:'#e3d7ff'}, // 연보라
  {name:'기타2',    color:'#e4e4e4'}  // 연회색
];
const DEFAULT_LINKS = [
  {t1:'마젠타룸',t2:'어드민',url:''},
  {t1:'마젠타룸',t2:'구글드라이브',url:''},
  {t1:'마젠타룸',t2:'상세페이지시트',url:''},
  {t1:'마젠타룸',t2:'G메일',url:''},
  {t1:'마젠타룸',t2:'의뢰서작성페이지',url:''},
  {t1:'',t2:'',url:''},{t1:'',t2:'',url:''},{t1:'',t2:'',url:''},{t1:'',t2:'',url:''},{t1:'',t2:'',url:''}
];

let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || typeof S !== 'object') S = {};
S.events = S.events || {};
S.todos  = S.todos  || [];
S.memo   = S.memo   || '';
function normLinks(arr){ return (arr && arr.length ? arr : DEFAULT_LINKS).map(l => ('name' in l) ? l : {name:[l.t1,l.t2].filter(Boolean).join('\n'), url:l.url||''}); }
S.links  = normLinks(S.links);
let pushTimer=null;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if(window.__remoteSave){ clearTimeout(pushTimer); pushTimer=setTimeout(()=>window.__remoteSave(JSON.parse(JSON.stringify(S))),500); }
}

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const WD = ['일','월','화','수','목','금','토'];

/* ===== 캘린더 ===== */
let view = new Date(); view.setDate(1);

/* 부부캘린더에서 그대로 옮긴 공휴일 · 기념일 · 가족 생일 */
// 대한민국 법정 공휴일 (2026~2027년, 대체공휴일 포함)
const KR_HOLIDAYS = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-01':'노동절','2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석',
  '2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'크리스마스',
  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체공휴일',
  '2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-05':'어린이날','2027-05-13':'부처님오신날',
  '2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일',
  '2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석','2027-10-03':'개천절','2027-10-04':'대체공휴일',
  '2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'크리스마스','2027-12-27':'대체공휴일'
};
// 공휴일은 아니지만 알아두면 좋은 기념일 (매년 고정)
const KR_OBSERVANCES = [
  {m:4, d:5, name:'식목일'},{m:5, d:8, name:'어버이날'},{m:5, d:15, name:'스승의날'},{m:10, d:1, name:'국군의날'}
];
// 가족 생일 (매년 자동 표시)
const FAMILY_BIRTHDAYS = [
  {type:'lunar', m:9,  d:15, name:'장인어른 생신'},
  {type:'solar', m:2,  d:9,  name:'장모님 생신'},
  {type:'lunar', m:10, d:20, name:'시어머니 생신'},
  {type:'lunar', m:7,  d:6,  name:'시아버지 생신'},
  {type:'solar', m:1,  d:4,  name:'해솔이 생일'},
  {type:'solar', m:6,  d:17, name:'하진 생일'},
  {type:'solar', m:11, d:29, name:'하준 생일'},
  {type:'solar', m:1,  d:31, name:'하은 생일'},
  {type:'solar', m:12, d:16, name:'은경 생일'},
  {type:'solar', m:3,  d:27, name:'혜지 생일'},
  {type:'solar', m:4,  d:23, name:'❤️ 하영이 생일'},
  {type:'solar', m:10, d:6,  name:'❤️ 원섭이 생일'},
  {type:'solar', m:10, d:12, name:'❤️ 결혼기념일', kind:'anniversary'}
];
function getSL(){ if(!window.solarLunar) return null; return window.solarLunar.default || window.solarLunar; }
function builtinItems(date){
  const mm=date.getMonth()+1, dd=date.getDate(), dk=ymd(date), items=[];
  if(KR_HOLIDAYS[dk]) items.push({kind:'holiday', name:KR_HOLIDAYS[dk]});
  const obs=KR_OBSERVANCES.find(o=>o.m===mm && o.d===dd);
  if(obs) items.push({kind:'observance', name:obs.name});
  FAMILY_BIRTHDAYS.forEach(fb=>{
    if(fb.type==='solar'){ if(fb.m===mm && fb.d===dd) items.push({kind:fb.kind||'birthday', name:fb.name}); }
    else { try{ const SL=getSL(); if(SL){ const s=SL.lunar2solar(date.getFullYear(), fb.m, fb.d, false);
      if(s && s.cMonth===mm && s.cDay===dd) items.push({kind:fb.kind||'birthday', name:fb.name}); } }catch(e){} }
  });
  return items;
}
// 날짜 칸에 표시할 한 줄 (우선순위: 가족 생일 > 공휴일 > 기념일 > 음력 1일) — 부부캘린더와 동일
function cellLabel(date){
  const items=builtinItems(date);
  const b=items.find(i=>i.kind==='birthday'||i.kind==='anniversary'); if(b) return b;
  const h=items.find(i=>i.kind==='holiday'); if(h) return h;
  const o=items.find(i=>i.kind==='observance'); if(o) return o;
  try{ const SL=getSL(); if(SL){ const l=SL.solar2lunar(date.getFullYear(), date.getMonth()+1, date.getDate());
    if(l && l.lDay===1) return {kind:'lunar', name:'음 '+l.lMonth+'.'+l.lDay}; } }catch(e){}
  return null;
}

/* 일정 데이터 정리: 각 일정에 고유 id 부여 (수정·순서변경용) */
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function ensureIds(){ let changed=false; for(const k in S.events){ (S.events[k]||[]).forEach(ev=>{ if(!ev.id){ ev.id=newId(); changed=true; } }); } return changed; }
ensureIds();

const MAX_CHIPS = 4;
function renderCal(){
  const y=view.getFullYear(), m=view.getMonth();
  $('ym').textContent = `${y}년 ${m+1}월`;
  const g=$('grid'); g.innerHTML='';
  WD.forEach(w=>{ const h=document.createElement('div'); h.className='wd'; h.textContent=w; g.appendChild(h); });
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  g.style.gridTemplateRows=`auto repeat(${Math.ceil((first+days)/7)},minmax(0,1fr))`;
  const todayKey=ymd(new Date());
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='day empty'; g.appendChild(e); }
  for(let d=1; d<=days; d++){
    const date=new Date(y,m,d), key=ymd(date), dow=date.getDay();
    const evs=S.events[key]||[];
    const cell=document.createElement('div');
    cell.className='day'+(dow===0?' sun':'')+(dow===6?' sat':'')+(KR_HOLIDAYS[key]?' holiday':'')
      +(key===todayKey?' is-today':'')+(evs.length<=2?' few':'');
    const top=document.createElement('div'); top.className='top';
    const n=document.createElement('span'); n.className='num'; n.textContent=d; top.appendChild(n);
    const lab=cellLabel(date);
    if(lab){ const s=document.createElement('span'); s.className='sub '+lab.kind; s.textContent=lab.name; s.title=lab.name; top.appendChild(s); }
    cell.appendChild(top);
    evs.slice(0,MAX_CHIPS).forEach(ev=>{
      const c=document.createElement('span');
      c.className='chip'+(ev.done?' done':'');
      c.style.background=(CATS[ev.cat]||CATS[5]).color;
      c.textContent=ev.text; c.title=ev.text;
      cell.appendChild(c);
    });
    if(evs.length>MAX_CHIPS){ const mo=document.createElement('div'); mo.className='more'; mo.textContent=`+${evs.length-MAX_CHIPS}개 더`; cell.appendChild(mo); }
    cell.onclick=()=>openDay(key, date);
    g.appendChild(cell);
  }
  const total=first+days, rest=(7-total%7)%7;
  for(let i=0;i<rest;i++){ const e=document.createElement('div'); e.className='day empty'; g.appendChild(e); }
}

$('prevM').onclick=()=>{ view.setMonth(view.getMonth()-1); renderCal(); };
$('nextM').onclick=()=>{ view.setMonth(view.getMonth()+1); renderCal(); };
// 음력 라이브러리가 늦게 로드되면 다시 그림
window.addEventListener('load', ()=>renderCal());

/* 날짜 모달 — 창 안에서 한 변경(추가·수정·삭제·체크·순서)은 「저장」을 눌러야 반영, 「취소」는 모두 버림 */
let curKey=null, curDate=null, curCat=0, editId=null, dragging=false, draft=[];
function renderCatPick(){
  const box=$('dmCats'); box.innerHTML='';
  CATS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.textContent=c.name; b.style.background=c.color;
    if(i===curCat) b.className='sel';
    b.addEventListener('mousedown', e=>e.preventDefault()); // 입력칸 커서 유지
    b.onclick=()=>{ curCat=i; renderCatPick(); };
    box.appendChild(b);
  });
}
function renderBuiltin(){
  const box=$('dmBuiltin'); box.innerHTML='';
  const icon={holiday:'🎌', observance:'📌', birthday:'🎂', anniversary:'💍'};
  builtinItems(curDate).forEach(it=>{
    const d=document.createElement('div'); d.className='builtin';
    const i=document.createElement('span'); i.textContent=icon[it.kind]||'📌';
    const t=document.createElement('span'); t.className='bt '+it.kind; t.textContent=it.name;
    const tag=document.createElement('span'); tag.className='btag'; tag.textContent='기본';
    d.append(i,t,tag); box.appendChild(d);
  });
}
function focusInput(){ const t=$('dmText'); t.focus(); const n=t.value.length; t.setSelectionRange(n,n); }
function setEditMode(ev){
  editId = ev ? ev.id : null;
  $('dmAdd').textContent = ev ? '수정' : '추가';
  $('dmText').placeholder = ev ? '내용 수정 후 Enter' : '일정 입력 후 Enter';
  if(ev){ $('dmText').value=ev.text; curCat=ev.cat||0; } else { $('dmText').value=''; }
  renderCatPick(); renderDayList(); focusInput();
}
function renderDayList(){
  if(dragging) return;
  const list=$('dmList'); list.innerHTML='';
  if(editId && !draft.some(e=>e.id===editId)) editId=null;
  $('dmEmpty').style.display = (draft.length || builtinItems(curDate).length) ? 'none' : 'block';
  draft.forEach((ev,i)=>{
    const li=document.createElement('li'); li.dataset.id=ev.id;
    li.className=(ev.done?'done':'')+(ev.id===editId?' editing':'');
    const grip=document.createElement('span'); grip.className='grip'; grip.textContent='⋮⋮'; grip.title='끌어서 순서 변경';
    grip.addEventListener('pointerdown', e=>startDrag(e, li));
    const ck=document.createElement('button'); ck.className='ck'+(ev.done?' on':'');
    ck.addEventListener('mousedown', e=>e.preventDefault());
    ck.onclick=()=>{ ev.done=!ev.done; renderDayList(); };
    const t=document.createElement('span'); t.className='txt'; t.textContent=ev.text; t.title='눌러서 수정';
    t.style.background=(CATS[ev.cat]||CATS[5]).color;
    t.addEventListener('mousedown', e=>e.preventDefault()); // 일정 칸엔 커서·선택이 생기지 않게
    t.onclick=()=>setEditMode(ev.id===editId ? null : ev);
    const x=document.createElement('button'); x.className='x'; x.textContent='×'; x.title='삭제';
    x.addEventListener('mousedown', e=>e.preventDefault());
    x.onclick=()=>{ draft.splice(i,1); if(ev.id===editId) setEditMode(null); else renderDayList(); };
    li.append(grip,ck,t,x); list.appendChild(li);
  });
}
/* 끌어서 순서 바꾸기 (마우스·터치 공통) */
function startDrag(e, li){
  e.preventDefault();
  const list=$('dmList'); dragging=true; li.classList.add('dragging');
  const move=ev=>{
    const others=[...list.children].filter(c=>c!==li);
    let before=null;
    for(const c of others){ const r=c.getBoundingClientRect(); if(ev.clientY < r.top + r.height/2){ before=c; break; } }
    if(before) list.insertBefore(li, before); else list.appendChild(li);
  };
  const up=()=>{
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    li.classList.remove('dragging'); dragging=false;
    const order=[...list.children].map(c=>c.dataset.id);
    const sorted=order.map(id=>draft.find(e=>e.id===id)).filter(Boolean);
    if(sorted.length===draft.length) draft=sorted;
    renderDayList();
  };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
function openDay(key, date){
  curKey=key; curDate=date;
  draft=JSON.parse(JSON.stringify(S.events[key]||[]));
  $('dmTitle').textContent=`${date.getMonth()+1}월 ${date.getDate()}일 (${WD[date.getDay()]})`;
  renderBuiltin();
  $('dayModal').classList.add('open');
  setEditMode(null);
}
// 입력칸 내용을 목록(draft)에 반영. 반영했으면 true
function applyInput(){
  const v=$('dmText').value.trim(); if(!v) return false;
  if(editId){ const ev=draft.find(e=>e.id===editId); if(ev){ ev.text=v; ev.cat=curCat; } }
  else draft.push({id:newId(), text:v, cat:curCat, done:false});
  return true;
}
function closeDay(){ $('dayModal').classList.remove('open'); editId=null; draft=[]; }
$('dmAdd').addEventListener('mousedown', e=>e.preventDefault());
$('dmAdd').onclick=()=>{ if(applyInput()) setEditMode(null); else focusInput(); };
$('dmSave').onclick=()=>{
  applyInput(); // 입력해두고 「추가」를 안 누른 내용도 함께 저장
  if(draft.length) S.events[curKey]=draft; else delete S.events[curKey];
  save(); renderCal(); closeDay();
};
$('dmCancel').onclick=closeDay;
$('dmText').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); $('dmAdd').click(); }
});

/* ===== 오늘일정 ===== */
function fmtToday(){ const d=new Date(); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function ensureRows(){ while(S.todos.length<5) S.todos.push({text:'',done:false}); }
function renderTodos(focusIdx){
  ensureRows();
  const list=$('todoList'); list.innerHTML='';
  S.todos.forEach((t,i)=>{
    const row=document.createElement('div'); row.className='todo-row'+(t.done?' done':'');
    const ck=document.createElement('button'); ck.className='ck'+(t.done?' on':'');
    ck.onclick=()=>{ t.done=!t.done; save(); renderTodos(); };
    const inp=document.createElement('input'); inp.value=t.text; inp.placeholder= i===0 ? '오늘 해야 할 일' : '';
    inp.oninput=()=>{ t.text=inp.value; save(); };
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter' && !e.isComposing){
        e.preventDefault();
        if(i===S.todos.length-1){ S.todos.push({text:'',done:false}); save(); renderTodos(i+1); }
        else list.querySelectorAll('input')[i+1].focus();
      }
    });
    const del=document.createElement('button'); del.className='del'; del.textContent='×'; del.title='줄 삭제';
    del.onclick=()=>{ S.todos.splice(i,1); save(); renderTodos(); };
    row.append(ck,inp,del); list.appendChild(row);
  });
  if(focusIdx!=null) list.querySelectorAll('input')[focusIdx].focus();
}
$('addTodo').onclick=()=>{ S.todos.push({text:'',done:false}); save(); renderTodos(S.todos.length-1); };
$('clearDone').onclick=()=>{ S.todos=S.todos.filter(t=>!t.done); save(); renderTodos(); };

/* ===== 메모 ===== */
$('memo').value=S.memo;
$('memo').oninput=e=>{ S.memo=e.target.value; save(); };

/* ===== 업무링크 ===== */
let curLink=null;
function normUrl(u){ u=u.trim(); if(!u) return ''; return /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://'+u; }
function renderLinks(){
  const g=$('linkGrid'); g.innerHTML='';
  S.links.forEach((l,i)=>{
    const a=document.createElement('a'); a.className='lbox';
    if(!l.name && !l.url) a.classList.add('empty');
    if(l.url){ a.href=l.url; a.target='_blank'; a.rel='noopener'; a.title=l.url; }
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=l.name;
    const pen=document.createElement('button'); pen.className='pen'; pen.textContent='✎'; pen.title='링크 수정';
    pen.onclick=e=>{ e.preventDefault(); e.stopPropagation(); openLink(i); };
    a.append(nm,pen);
    a.onclick=e=>{ if(!l.url){ e.preventDefault(); openLink(i); } };
    g.appendChild(a);
  });
}
function openLink(i){
  curLink=i; const l=S.links[i];
  $('lmName').value=l.name; $('lmUrl').value=l.url;
  $('linkModal').classList.add('open');
  setTimeout(()=>$('lmName').focus(),50);
}
$('lmSave').onclick=()=>{
  S.links[curLink]={name:$('lmName').value.trim(), url:normUrl($('lmUrl').value)};
  save(); renderLinks(); $('linkModal').classList.remove('open');
};
$('lmClear').onclick=()=>{ S.links[curLink]={name:'',url:''}; save(); renderLinks(); $('linkModal').classList.remove('open'); };

/* ===== 모달 닫기 ===== */
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',e=>{ if(m.id==='dayModal') return; if(e.target===m || e.target.hasAttribute('data-close')) m.classList.remove('open'); });
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if($('dayModal').classList.contains('open')){ if(editId) setEditMode(null); return; }
  document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')); });

/* ===== 시작 ===== */
$('todayDate').textContent=fmtToday();
renderCal(); renderTodos(); renderLinks();

/* ===== 공유 데이터 반영 (Firebase에서 호출) ===== */
window.__getState = () => JSON.parse(JSON.stringify(S));
window.__applyRemote = function(data){
  if(!data) return;
  S.events = data.events || {};
  if(ensureIds()) save();
  S.todos  = data.todos  || [];
  S.memo   = data.memo   || '';
  S.links  = normLinks(data.links);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  renderCal(); renderLinks();
  const ae=document.activeElement;
  if(!(ae && ae.closest && ae.closest('#todoList'))) renderTodos();
  if(ae!==$('memo')) $('memo').value=S.memo;
  if($('dayModal').classList.contains('open')) { ensureIds(); renderDayList(); }
};
</script>

<!-- Firebase 실시간 공유 (부부캘린더와 같은 Firebase 프로젝트, 별도 문서 workBoard/main 사용) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAixyFeL813BFuIJhqhtO5c-ijLocJW0u8",
    authDomain: "family-calendar-55149.firebaseapp.com",
    projectId: "family-calendar-55149",
    storageBucket: "family-calendar-55149.firebasestorage.app",
    messagingSenderId: "570832112330",
    appId: "1:570832112330:web:001e906abe15bfb5248233"
  };

  const st = document.getElementById('syncStatus');
  const setStatus = (t, cls) => { st.textContent = t; st.className = 'sync ' + (cls || ''); };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ref = doc(db, "workBoard", "main");

    window.__remoteSave = async (data) => {
      setStatus('저장 중…');
      try { await setDoc(ref, { data, updatedAt: Date.now() }); setStatus('● 동기화됨', 'ok'); }
      catch(e) { setStatus('저장 실패: ' + (e.code || e.message), 'err'); }
    };

    onSnapshot(ref, (snap) => {
      if (snap.metadata.hasPendingWrites) return;          // 내가 방금 저장한 건 건너뜀
      if (!snap.exists()) { window.__remoteSave(window.__getState()); return; } // 첫 실행: 이 기기 데이터를 올림
      window.__applyRemote(snap.data().data);
      setStatus('● 동기화됨', 'ok');
    }, (err) => {
      setStatus('동기화 오류: Firestore 규칙 확인 필요 (' + (err.code || '') + ')', 'err');
    });
  } catch(e) {
    setStatus('연결 실패 — 이 기기에만 저장 중', 'err');
  }
</script>
</body>
