<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EF;
    --ink:#2E3A38;
    --ink-soft:#6B7573;
    --line:#DDD5C7;
    --me:#C97B4A;
    --spouse:#4E7C78;
    --both:#B5484F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR', sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .month-title{font-family:'Gowun Batang', serif;font-size:30px;font-weight:700;letter-spacing:-0.5px;}
  .month-title .year{font-size:15px;color:var(--ink-soft);font-family:'Noto Sans KR', sans-serif;font-weight:500;margin-left:6px;}
  .nav-btns{display:flex;gap:8px;}
  .nav-btns button{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer;}
  .nav-btns button:active{background:var(--line);}
  .thread{height:1px;background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);margin:14px 0 18px;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cell{position:relative;aspect-ratio:1/1.08;border-radius:12px;padding:6px 4px 4px;background:#fff;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;}
  .cell.empty{background:transparent;cursor:default;}
  .cell .num{font-size:12.5px;color:var(--ink);}
  .cell.today .num{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;}
  .cell.sun .num{color:#B5484F;}
  .cell.sat .num{color:#4E6E9E;}
  .cell.sel{border:1px solid var(--ink);}
  .dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;}
  .dot{width:5px;height:5px;border-radius:50%;}
  .dot.me{background:var(--me);}
  .dot.spouse{background:var(--spouse);}
  .dot.both{background:var(--both);}
  .legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink-soft);margin-top:16px;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend .dot{width:7px;height:7px;}
  .day-panel{margin-top:22px;}
  .day-panel h3{font-family:'Gowun Batang', serif;font-size:18px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .add-btn{border:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 12px;border-radius:20px;cursor:pointer;}
  .event-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--line);}
  .event-item.me{border-left-color:var(--me);}
  .event-item.spouse{border-left-color:var(--spouse);}
  .event-item.both{border-left-color:var(--both);}
  .event-item .who{font-size:11px;font-weight:600;color:var(--ink-soft);white-space:nowrap;padding-top:1px;}
  .event-item .body{flex:1;}
  .event-item .title{font-size:14px;font-weight:500;}
  .event-item .time{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .event-item .memo{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .event-item .del{border:none;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0 2px;}
  .empty-note{font-size:13px;color:var(--ink-soft);text-align:center;padding:18px 0;}
  .modal-bg{position:fixed;inset:0;background:rgba(46,58,56,0.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px 28px;}
  .modal h4{font-family:'Gowun Batang', serif;font-size:18px;margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);}
  .field textarea{resize:none;height:56px;}
  .who-select{display:flex;gap:8px;}
  .who-select button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .who-select button.active[data-who="me"]{background:var(--me);color:#fff;border-color:var(--me);}
  .who-select button.active[data-who="spouse"]{background:var(--spouse);color:#fff;border-color:var(--spouse);}
  .who-select button.active[data-who="both"]{background:var(--both);color:#fff;border-color:var(--both);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:11px 0;border-radius:12px;border:none;font-size:14px;cursor:pointer;}
  .cancel-btn{background:#fff;border:1px solid var(--line) !important;color:var(--ink-soft);}
  .save-btn{background:var(--ink);color:#fff;}
  .sync-note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;}
  .hidden{display:none !important;}
  .setup-warning{background:#FFF3E0;border:1px solid #E3A857;color:#5c4419;font-size:12.5px;padding:12px 14px;border-radius:10px;margin-bottom:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div id="setupWarning" class="setup-warning hidden">
    ⚠️ firebaseConfig가 아직 설정되지 않았어요. 코드 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 설정으로 바꿔주세요.
  </div>

  <header>
    <div class="month-title"><span id="monthNum"></span>월<span class="year" id="yearNum"></span></div>
    <div class="nav-btns">
      <button id="prevBtn">‹</button>
      <button id="nextBtn">›</button>
    </div>
  </header>
  <div class="thread"></div>

  <div class="weekdays">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="legend">
    <span><span class="dot me"></span>나</span>
    <span><span class="dot spouse"></span>배우자</span>
    <span><span class="dot both"></span>함께</span>
  </div>

  <div class="day-panel">
    <h3><span id="selDateLabel"></span><button class="add-btn" id="addBtn">+ 일정 추가</button></h3>
    <div id="eventList"></div>
  </div>

  <div class="sync-note" id="statusNote">불러오는 중…</div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <h4>새 일정</h4>
    <div class="field">
      <label>누구 일정인가요?</label>
      <div class="who-select">
        <button data-who="me" class="active">나</button>
        <button data-who="spouse">배우자</button>
        <button data-who="both">함께</button>
      </div>
    </div>
    <div class="field">
      <label>일정 제목</label>
      <input id="titleInput" placeholder="예: 아기 예방접종">
    </div>
    <div class="field">
      <label>시간 (선택)</label>
      <input id="timeInput" type="time">
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="memoInput" placeholder="장소, 준비물 등"></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" id="cancelBtn">취소</button>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<!--
  ▼▼▼ 여기 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 교체하세요 ▼▼▼
  Firebase 콘솔 > 프로젝트 설정 > "내 앱"에서 복사한 값을 그대로 붙여넣으면 됩니다.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAixyFeL813BFuIJhqhtO5c-ijLocJW0u8",
    authDomain: "family-calendar-55149.firebaseapp.com",
    projectId: "family-calendar-55149",
    storageBucket: "family-calendar-55149.firebasestorage.app",
    messagingSenderId: "570832112330",
    appId: "1:570832112330:web:001e906abe15bfb5248233"
  };

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('여기에');

  let db = null;
  let eventsDocRef = null;

  if(isConfigured){
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    eventsDocRef = doc(db, "coupleCalendar", "events");
  } else {
    document.getElementById('setupWarning').classList.remove('hidden');
  }

  const WHO_LABEL = {me:'나', spouse:'배우자', both:'함께'};
  let events = {};
  let cursor = new Date();
  cursor.setDate(1);
  let selectedDate = keyFor(new Date());
  let selectedWho = 'me';

  function pad(n){return n<10?'0'+n:''+n;}
  function keyFor(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

  async function initData(){
    const statusNote = document.getElementById('statusNote');
    if(!isConfigured){
      try{
        const raw = localStorage.getItem('couple-calendar-events');
        events = raw ? JSON.parse(raw) : {};
      }catch(e){ events = {}; }
      statusNote.textContent = 'Firebase 설정 전이라 이 기기에만 저장돼요.';
      render();
      return;
    }
    statusNote.textContent = '실시간으로 배우자와 동기화돼요.';
    // 실시간 구독: 상대방이 추가한 일정도 자동으로 반영됨
    onSnapshot(eventsDocRef, (snap)=>{
      events = snap.exists() ? (snap.data().data || {}) : {};
      render();
    }, (err)=>{
      statusNote.textContent = '동기화 오류: Firestore 규칙을 확인해주세요.';
    });
  }

  async function persist(){
    if(!isConfigured){
      try{ localStorage.setItem('couple-calendar-events', JSON.stringify(events)); }catch(e){}
      render();
      return;
    }
    try{
      await setDoc(eventsDocRef, { data: events });
    }catch(e){
      document.getElementById('statusNote').textContent = '저장 실패: ' + e.message;
    }
  }

  function render(){
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    document.getElementById('monthNum').textContent = (month+1);
    document.getElementById('yearNum').textContent = year;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayKey = keyFor(new Date());

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i=0;i<firstDay;i++){
      const div = document.createElement('div');
      div.className = 'cell empty';
      grid.appendChild(div);
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateObj = new Date(year, month, d);
      const dk = keyFor(dateObj);
      const dow = dateObj.getDay();
      const dayList = events[dk] || [];
      const cell = document.createElement('div');
      cell.className = 'cell'
        + (dk===todayKey ? ' today' : '')
        + (dow===0 ? ' sun' : '')
        + (dow===6 ? ' sat' : '')
        + (dk===selectedDate ? ' sel' : '');
      cell.innerHTML = '<div class="num">'+d+'</div>';
      if(dayList.length>0){
        const dots = document.createElement('div');
        dots.className = 'dots';
        dayList.slice(0,4).forEach(e=>{
          const dot = document.createElement('div');
          dot.className = 'dot '+e.who;
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }
      cell.addEventListener('click', ()=>{ selectedDate = dk; render(); });
      grid.appendChild(cell);
    }

    document.getElementById('selDateLabel').textContent = selectedDate.replace(/-/g,'.');
    renderDayList();
  }

  function renderDayList(){
    const list = document.getElementById('eventList');
    list.innerHTML = '';
    const dayEvents = (events[selectedDate] || []).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    if(dayEvents.length===0){
      list.innerHTML = '<div class="empty-note">등록된 일정이 없어요.</div>';
      return;
    }
    dayEvents.forEach(e=>{
      const item = document.createElement('div');
      item.className = 'event-item '+e.who;
      item.innerHTML =
        '<div class="who">'+WHO_LABEL[e.who]+'</div>'
        + '<div class="body">'
        +   '<div class="title"></div>'
        +   (e.time ? '<div class="time">'+e.time+'</div>' : '')
        +   (e.memo ? '<div class="memo"></div>' : '')
        + '</div>'
        + '<button class="del">×</button>';
      item.querySelector('.title').textContent = e.title;
      if(e.memo) item.querySelector('.memo').textContent = e.memo;
      item.querySelector('.del').addEventListener('click', ()=>{
        events[selectedDate] = events[selectedDate].filter(x=>x.id!==e.id);
        if(events[selectedDate].length===0) delete events[selectedDate];
        persist();
      });
      list.appendChild(item);
    });
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    render();
  });

  const modalBg = document.getElementById('modalBg');
  document.getElementById('addBtn').addEventListener('click', ()=>{
    selectedWho = 'me';
    document.querySelectorAll('.who-select button').forEach(b=>b.classList.toggle('active', b.dataset.who==='me'));
    document.getElementById('titleInput').value = '';
    document.getElementById('timeInput').value = '';
    document.getElementById('memoInput').value = '';
    modalBg.classList.remove('hidden');
  });
  document.getElementById('cancelBtn').addEventListener('click', ()=> modalBg.classList.add('hidden'));
  modalBg.addEventListener('click', (e)=>{ if(e.target===modalBg) modalBg.classList.add('hidden'); });

  document.querySelectorAll('.who-select button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedWho = btn.dataset.who;
      document.querySelectorAll('.who-select button').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const title = document.getElementById('titleInput').value.trim();
    if(!title) return;
    const time = document.getElementById('timeInput').value;
    const memo = document.getElementById('memoInput').value.trim();
    const list = events[selectedDate] ? events[selectedDate].slice() : [];
    list.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), who: selectedWho, title, time, memo});
    events[selectedDate] = list;
    persist();
    modalBg.classList.add('hidden');
  });

  initData();
</script>
</body>
</html>
