<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/solarlunar/dist/solarlunar.min.js"></script>
<style>
  :root{
    --paper:#FFF8FC;
    --ink:#4A4360;
    --ink-soft:#A79BB8;
    --line:#F2DFEE;
    --accent:#FF6FA5;
    --me:#4D9DFF;
    --spouse:#FF5FA8;
    --both:#3FD08C;
    --hs:#FFA53D;
    --shadow:0 2px 10px rgba(180,140,190,0.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:linear-gradient(180deg,#FFF8FC 0%,#FCF3FF 100%);color:var(--ink);font-family:'Pretendard','Noto Sans KR', sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:14px 16px 60px;}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .month-title{font-family:'Pretendard', sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--accent);}
  .year-btn{font-size:15px;color:var(--ink-soft);font-family:'Pretendard', sans-serif;font-weight:600;margin-left:6px;border:none !important;background:none !important;outline:none !important;box-shadow:none !important;cursor:pointer;padding:2px 6px;border-radius:8px;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none;}
  .year-btn:active{background:var(--line) !important;}
  .nav-btns{display:flex;gap:8px;}
  .nav-btns button{border:none;background:#fff;width:36px;height:36px;border-radius:50%;font-size:16px;color:var(--accent);cursor:pointer;box-shadow:var(--shadow);}
  .nav-btns button:active{background:var(--line);}
  .thread{height:2px;background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);margin:10px 0 12px;border-radius:2px;}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .cal-viewport{overflow:hidden;width:100%;}
  .cal-track{display:flex;width:300%;transform:translateX(-33.3333%);}
  .cal-track.animate{transition:transform 0.28s cubic-bezier(.22,.61,.36,1);}
  .month-panel{width:33.3333%;flex:none;box-sizing:border-box;padding:0 1px;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:pan-y;}
  .cell{position:relative;min-height:60px;border-radius:14px;padding:4px 3px 3px;background:#fff;border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;touch-action:pan-y;box-shadow:0 1px 4px rgba(180,140,190,0.10);}
  .cell.empty{background:transparent;cursor:default;box-shadow:none;}
  .cell .num{font-size:11px;color:var(--ink);font-weight:600;}
  .cell.today{border-color:var(--accent);background:#FFF0F6;}
  .cell.other-month{opacity:0.4;box-shadow:none;}
  .cell.other-month.today{border-color:var(--ink-soft);}
  .cell.sun .num{color:#FF7A8A;}
  .cell.sat .num{color:#6FA8FF;}
  .cell.holiday .num{color:#FF7A8A;}
  .holiday-name{font-size:7px;color:#FF7A8A;font-weight:700;line-height:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .observance-name{font-size:7px;color:#3FA0A0;font-weight:700;line-height:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .lunar-date{font-size:7px;color:var(--ink-soft);line-height:9px;}
  .cell.sel{border-color:var(--ink);}
  .bars{width:100%;display:flex;flex-direction:column;gap:1px;}
  .bar{height:11px;font-size:8px;line-height:11px;color:#fff;border-radius:5px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;box-sizing:border-box;text-align:left;font-weight:600;flex:none;}
  .bar.me{background:var(--me);}
  .bar.spouse{background:var(--spouse);}
  .bar.both{background:var(--both);}
  .bar.hs{background:var(--hs);}
  .bar.bar-empty{background:transparent;}
  .bar.no-radius-left{border-top-left-radius:0;border-bottom-left-radius:0;}
  .bar.no-radius-right{border-top-right-radius:0;border-bottom-right-radius:0;}
  .more-tag{font-size:8px;color:var(--ink-soft);text-align:center;}
  .dot.me{background:var(--me);}
  .dot.spouse{background:var(--spouse);}
  .dot.both{background:var(--both);}
  .dot.hs{background:var(--hs);}
  .legend{display:flex;gap:14px;justify-content:center;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:12px;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .day-panel{margin-top:14px;}
  .day-panel h3{font-family:'Pretendard', sans-serif;font-size:17px;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;}
  .add-btn{border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer;box-shadow:0 3px 8px rgba(255,111,165,0.35);}
  .event-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:14px;padding:9px 11px;margin-bottom:7px;border-left:5px solid var(--line);box-shadow:0 1px 4px rgba(180,140,190,0.10);}
  .event-item.me{border-left-color:var(--me);}
  .event-item.spouse{border-left-color:var(--spouse);}
  .event-item.both{border-left-color:var(--both);}
  .event-item.hs{border-left-color:var(--hs);}
  .event-item .who{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;padding-top:1px;}
  .event-item .body{flex:1;}
  .event-item .title{font-size:13px;font-weight:600;}
  .event-item .time{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .event-item .memo{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .event-item .del{border:none;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;padding:0 2px;}
  .empty-note{font-size:13px;color:var(--ink-soft);text-align:center;padding:18px 0;}
  .modal-bg{position:fixed;inset:0;background:rgba(90,60,100,0.28);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  #yearModalBg{z-index:60;}
  .modal{background:var(--paper);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 28px;box-shadow:0 -4px 20px rgba(180,140,190,0.2);}
  .modal h4{font-family:'Pretendard', sans-serif;font-size:18px;font-weight:800;margin:0 0 14px;color:var(--accent);}
  .field{margin-bottom:12px;}
  .modal-grabber{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field textarea, .field select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);}
  .icon-input{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:9px 11px;}
  .icon-input-top{align-items:flex-start;}
  .icon-input-ico{font-size:15px;line-height:1.3;flex:none;}
  .icon-input input, .icon-input textarea{border:none !important;padding:0 !important;flex:1;background:transparent;}
  .field input:focus, .field textarea:focus, .field select:focus,
  .icon-input input:focus, .icon-input textarea:focus,
  .date-field-btn:focus{outline:none;}
  .field textarea{resize:none;height:56px;}
  .inline-panel{margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;}
  .time-picker-v{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:132px;overflow:hidden;}
  .wheel-col{position:relative;height:132px;width:56px;}
  .wheel-col .wheel{height:132px;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .wheel-col .wheel::-webkit-scrollbar{display:none;}
  .wheel-spacer{height:44px;}
  .wheel-item{height:44px;line-height:44px;text-align:center;font-size:19px;font-weight:600;color:var(--ink-soft);scroll-snap-align:center;font-family:'Pretendard', monospace;}
  .wheel-item.active{color:var(--accent);font-size:22px;font-weight:800;}
  .colon-v{font-size:22px;font-weight:700;color:var(--ink-soft);}
  .wheel-highlight-v{position:absolute;left:4px;right:4px;top:50%;transform:translateY(-50%);height:44px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);pointer-events:none;border-radius:8px;}
  .wheel-type-input{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:44px;text-align:center;font-size:22px;font-weight:800;color:var(--accent);border:1.5px solid var(--accent) !important;border-radius:8px;background:#fff;padding:0 !important;font-family:'Pretendard', monospace;}
  .time-hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .who-select{display:flex;gap:6px;}
  .who-select button{flex:1;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;}
  .who-select .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .who-select button.active .dot{background:#fff !important;}
  .who-select button.active[data-who="me"]{background:var(--me);color:#fff;border-color:var(--me);}
  .who-select button.active[data-who="spouse"]{background:var(--spouse);color:#fff;border-color:var(--spouse);}
  .who-select button.active[data-who="both"]{background:var(--both);color:#fff;border-color:var(--both);}
  .who-select button.active[data-who="hs"]{background:var(--hs);color:#fff;border-color:var(--hs);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px 0;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .cancel-btn{background:#fff;border:1.5px solid var(--line) !important;color:var(--ink-soft);}
  .save-btn{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,111,165,0.35);}
  .sync-note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:10px;}
  .hidden{display:none !important;}
  .setup-warning{background:#FFF3E0;border:1px solid #E3A857;color:#5c4419;font-size:12.5px;padding:12px 14px;border-radius:12px;margin-bottom:16px;line-height:1.5;}
  .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:320px;overflow-y:auto;}
  .year-grid button{padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink);}
  .year-grid button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .edit-btn{border:none;background:none;color:var(--ink-soft);font-size:14px;cursor:pointer;padding:0 2px;}
  .date-field-btn{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer;font-weight:600;}
  .datetime-box{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
  .datetime-box .date-field-btn{flex:1;border:none;border-radius:0;background:transparent;padding-left:6px;}
  .datetime-box .dt-divider{width:1.5px;align-self:stretch;background:var(--line);}
  .dt-ico{font-size:14px;padding-left:11px;flex:none;}
  .dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .dp-header button{border:none;background:#fff;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--accent);box-shadow:var(--shadow);}
  .dp-title{font-size:16px;font-weight:800;display:flex;align-items:baseline;color:var(--accent);}
  .mini-weekdays{font-size:10px;font-weight:600;margin-bottom:2px;}
  .grid.mini{gap:3px;}
  .grid.mini .cell{border-radius:9px;padding:2px 1px 1px;min-height:0;gap:1px;box-shadow:none;}
  .grid.mini .num{font-size:10px;}
  .grid.mini .bar{height:8px;font-size:6.5px;line-height:8px;border-radius:3px;padding:0 2px;}
  .grid.mini .more-tag{font-size:6.5px;}
  .grid.mini .cell.today{border-width:1.5px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="setupWarning" class="setup-warning hidden">
    ⚠️ firebaseConfig가 아직 설정되지 않았어요. 코드 상단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 설정으로 바꿔주세요.
  </div>

  <header>
    <div class="month-title"><span id="monthNum"></span>월<button class="year-btn" id="yearBtn"><span id="yearNum"></span></button></div>
    <div class="nav-btns">
      <button id="prevBtn">‹</button>
      <button id="nextBtn">›</button>
    </div>
  </header>
  <div class="thread"></div>

  <div class="weekdays">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>
  <div class="cal-viewport" id="calViewport">
    <div class="cal-track" id="calTrack">
      <div class="grid month-panel" id="gridPrev"></div>
      <div class="grid month-panel" id="gridCur"></div>
      <div class="grid month-panel" id="gridNext"></div>
    </div>
  </div>

  <div class="legend">
    <span><span class="dot me"></span>원섭</span>
    <span><span class="dot spouse"></span>하영</span>
    <span><span class="dot both"></span>함께</span>
    <span><span class="dot hs"></span>해솔</span>
  </div>

  <div class="day-panel">
    <h3><span id="selDateLabel"></span><button class="add-btn" id="addBtn">+ 일정 추가</button></h3>
    <div id="eventList"></div>
  </div>

  <div class="sync-note" id="statusNote">불러오는 중…</div>
</div>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal">
    <div class="modal-grabber"></div>
    <h4 id="modalTitle">새 일정</h4>
    <div class="field">
      <div class="who-select">
        <button data-who="me" class="active"><span class="dot me"></span>원섭</button>
        <button data-who="spouse"><span class="dot spouse"></span>하영</button>
        <button data-who="both"><span class="dot both"></span>함께</button>
        <button data-who="hs"><span class="dot hs"></span>해솔</button>
      </div>
    </div>
    <div class="field">
      <div class="icon-input">
        <span class="icon-input-ico">📝</span>
        <input id="titleInput" placeholder="제목을 입력하세요">
      </div>
    </div>
    <div class="field">
      <label>시작</label>
      <div class="datetime-box">
        <span class="dt-ico">📅</span>
        <button type="button" class="date-field-btn" id="dateFieldBtn" data-target="start"></button>
        <div class="dt-divider"></div>
        <span class="dt-ico">🕐</span>
        <button type="button" class="date-field-btn" id="timeFieldBtn" data-target="start"></button>
      </div>
    </div>
    <div class="field">
      <label>종료</label>
      <div class="datetime-box">
        <span class="dt-ico">📅</span>
        <button type="button" class="date-field-btn" id="endDateFieldBtn" data-target="end"></button>
        <div class="dt-divider"></div>
        <span class="dt-ico">🕐</span>
        <button type="button" class="date-field-btn" id="endTimeFieldBtn" data-target="end"></button>
      </div>
      <div class="inline-panel hidden" id="dateInlinePanel">
        <div class="dp-header">
          <button id="dpPrev">‹</button>
          <div class="dp-title"><span id="dpMonthNum"></span>월<button class="year-btn" id="dpYearBtn"><span id="dpYearNum"></span></button></div>
          <button id="dpNext">›</button>
        </div>
        <div class="weekdays mini-weekdays">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="cal-viewport" id="dpViewport">
          <div class="cal-track" id="dpTrack">
            <div class="grid month-panel mini" id="dpGridPrev"></div>
            <div class="grid month-panel mini" id="dpGridCur"></div>
            <div class="grid month-panel mini" id="dpGridNext"></div>
          </div>
        </div>
      </div>
      <div class="inline-panel hidden" id="timeInlinePanel">
        <div class="time-picker-v">
          <div class="wheel-col">
            <div class="wheel" id="ampmWheel"></div>
          </div>
          <div class="wheel-col">
            <div class="wheel" id="hourWheel"></div>
            <input type="tel" inputmode="numeric" class="wheel-type-input hidden" id="hourTypeInput" maxlength="2">
          </div>
          <span class="colon-v">:</span>
          <div class="wheel-col">
            <div class="wheel" id="minWheel"></div>
            <input type="tel" inputmode="numeric" class="wheel-type-input hidden" id="minTypeInput" maxlength="2">
          </div>
          <div class="wheel-highlight-v"></div>
        </div>
        <div class="time-hint">탭하면 숫자를 직접 입력할 수 있어요</div>
      </div>
    </div>
    <div class="field">
      <div class="icon-input icon-input-top">
        <span class="icon-input-ico">📍</span>
        <textarea id="memoInput" placeholder=""></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" id="cancelBtn">취소</button>
      <button class="save-btn" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="yearModalBg">
  <div class="modal">
    <h4>연도 선택</h4>
    <div class="year-grid" id="yearGrid"></div>
    <div class="modal-actions">
      <button class="cancel-btn" id="yearCancelBtn">닫기</button>
    </div>
  </div>
</div>

<!--
  ▼▼▼ 여기 firebaseConfig 값을 본인의 Firebase 프로젝트 설정으로 교체하세요 ▼▼▼
  Firebase 콘솔 > 프로젝트 설정 > "내 앱"에서 복사한 값을 그대로 붙여넣으면 됩니다.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAixyFeL813BFuIJhqhtO5c-ijLocJW0u8",
    authDomain: "family-calendar-55149.firebaseapp.com",
    projectId: "family-calendar-55149",
    storageBucket: "family-calendar-55149.firebasestorage.app",
    messagingSenderId: "570832112330",
    appId: "1:570832112330:web:001e906abe15bfb5248233"
  };

  const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('여기에');

  let db = null;
  let eventsDocRef = null;

  if(isConfigured){
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    eventsDocRef = doc(db, "coupleCalendar", "events");
  } else {
    document.getElementById('setupWarning').classList.remove('hidden');
  }

  const WHO_LABEL = {me:'원섭', spouse:'하영', both:'함께', hs:'해솔'};
  // 대한민국 법정 공휴일 (2026~2027년, 대체공휴일 포함) — 노동절·제헌절은 2026년부터 정부가 공식 공휴일로 재지정
  // 그 외 연도는 공휴일 표시 없이 음력 날짜만 표시됨
  const KR_HOLIDAYS = {
    '2026-01-01':'신정',
    '2026-02-16':'설날',
    '2026-02-17':'설날',
    '2026-02-18':'설날',
    '2026-03-01':'삼일절',
    '2026-03-02':'대체공휴일',
    '2026-05-01':'노동절',
    '2026-05-05':'어린이날',
    '2026-05-24':'부처님오신날',
    '2026-05-25':'대체공휴일',
    '2026-06-06':'현충일',
    '2026-07-17':'제헌절',
    '2026-08-15':'광복절',
    '2026-08-17':'대체공휴일',
    '2026-09-24':'추석',
    '2026-09-25':'추석',
    '2026-09-26':'추석',
    '2026-10-03':'개천절',

  function pad(n){return n<10?'0'+n:''+n;}
  function keyFor(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function parseDateKey(dk){
    if(typeof dk !== 'string') return new Date(NaN);
    const parts = dk.split('-').map(Number);
    if(parts.length!==3 || parts.some(n=>isNaN(n))) return new Date(NaN);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function getEventsForDate(dk){
    const targetTime = parseDateKey(dk).getTime();
    const result = [];
    for(const startKey in events){
      const startTime = parseDateKey(startKey).getTime();
      (events[startKey]||[]).forEach(e=>{
        const endKey = e.endDate || startKey;
        const endTime = parseDateKey(endKey).getTime();
        if(targetTime>=startTime && targetTime<=endTime){
          result.push(Object.assign({}, e, {_storeKey:startKey}));
        }
      });
    }
    return result;
  }

  const MAX_BAR_LANES = 2;
  function computeWeekLanes(weekDates){
    const weekStartTime = weekDates[0].getTime();
    const weekEndTime = weekDates[6].getTime();
    const seen = new Set();
    const weekEvents = [];
    weekDates.forEach(d=>{
      getEventsForDate(keyFor(d)).forEach(e=>{
        const key = e._storeKey+'|'+e.id;
        if(!seen.has(key)){ seen.add(key); weekEvents.push(e); }
      });
    });
    weekEvents.sort((a,b)=>{
      const as = parseDateKey(a._storeKey).getTime();
      const bs = parseDateKey(b._storeKey).getTime();
      if(as!==bs) return as-bs;
      const aEnd = parseDateKey(a.endDate||a._storeKey).getTime();
      const bEnd = parseDateKey(b.endDate||b._storeKey).getTime();
      if(bEnd!==aEnd) return bEnd-aEnd; // 더 긴 일정을 먼저 배치해 연속 막대가 안정적으로 자리잡게 함
      return String(a.id).localeCompare(String(b.id));
    });
    const laneEndTimes = [];
    const laneMap = {};
    weekEvents.forEach(e=>{
      const s = Math.max(parseDateKey(e._storeKey).getTime(), weekStartTime);
      const en = Math.min(parseDateKey(e.endDate||e._storeKey).getTime(), weekEndTime);
      let lane = 0;
      while(laneEndTimes[lane]!==undefined && laneEndTimes[lane] >= s){ lane++; }
      laneEndTimes[lane] = en;
      laneMap[e._storeKey+'|'+e.id] = lane;
    });
    return laneMap;
  }

  function buildMonthGrid(container, year, month, todayKey, selectedKey, onClick, heightPx, showExtras){
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const prevMonthDaysCount = new Date(year, month, 0).getDate();
    container.innerHTML = '';

    const dates = [];
    for(let i=firstDay-1; i>=0; i--){ dates.push({d:new Date(year, month-1, prevMonthDaysCount-i), other:true}); }
    for(let d=1; d<=daysInMonth; d++){ dates.push({d:new Date(year, month, d), other:false}); }
    const totalSoFar = firstDay + daysInMonth;
    const remainder = totalSoFar % 7;
    const trailingCount = remainder===0 ? 0 : 7-remainder;
    for(let d=1; d<=trailingCount; d++){ dates.push({d:new Date(year, month+1, d), other:true}); }

    for(let w=0; w<dates.length; w+=7){
      const weekChunk = dates.slice(w, w+7);
      const weekDates = weekChunk.map(x=>x.d);
      const laneMap = computeWeekLanes(weekDates);
      weekChunk.forEach((item, i)=>{
        const dateObj = item.d;
        const dayTime = dateObj.getTime();
        const weekStartTime = weekDates[0].getTime();
        const isRowStart = (i===0);
        const dayEvents = getEventsForDate(keyFor(dateObj));
        const laneSlots = new Array(MAX_BAR_LANES).fill(null);
        let overflow = 0;
        dayEvents.forEach(e=>{
          const lane = laneMap[e._storeKey+'|'+e.id];
          if(lane < MAX_BAR_LANES){
            const startTime = parseDateKey(e._storeKey).getTime();
            const endTime = parseDateKey(e.endDate||e._storeKey).getTime();
            laneSlots[lane] = {
              e,
              showTitle: (dayTime===startTime) || (isRowStart && startTime<weekStartTime),
              isStart: dayTime===startTime,
              isEnd: dayTime===endTime
            };
          } else {
            overflow++;
          }
        });
        container.appendChild(buildDayCell(dateObj, item.other, todayKey, selectedKey, onClick, showExtras, laneSlots, overflow));
      });
    }

    const rows = dates.length / 7;
    container.style.height = (heightPx || CAL_HEIGHT) + 'px';
    container.style.gridTemplateRows = 'repeat('+rows+', 1fr)';
  }

  // ── 스와이프(드래그 추적) 로 월 이동 — 범용 함수 ──
  function setupMonthSwipe(viewportEl, trackEl, onMonthShift){
    let startX=0, startY=0, dragging=false, isHorizontal=null, lastDx=0, viewportW=0, pendingShift=0;
    viewportEl.addEventListener('touchstart', (e)=>{
      if(e.touches.length!==1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isHorizontal = null;
      dragging = true;
      lastDx = 0;
      viewportW = viewportEl.clientWidth || 1;
      trackEl.classList.remove('animate');
    }, {passive:true});

    viewportEl.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if(isHorizontal===null){
        if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
      }
      if(isHorizontal){
        e.preventDefault();
        lastDx = dx;
        let pct = -33.3333 + (dx / viewportW) * 33.3333;
        if(pct > 0) pct = pct * 0.35;
        if(pct < -66.6666) pct = -66.6666 + (pct+66.6666)*0.35;
        trackEl.style.transform = 'translateX('+pct+'%)';
      }
    }, {passive:false});

    viewportEl.addEventListener('touchend', ()=>{
      if(!dragging) return;
      dragging = false;
      if(isHorizontal){
        const threshold = viewportW * 0.22;
        trackEl.classList.add('animate');
        if(lastDx <= -threshold){
          trackEl.style.transform = 'translateX(-66.6667%)';
          pendingShift = 1;
        } else if(lastDx >= threshold){
          trackEl.style.transform = 'translateX(0%)';
          pendingShift = -1;
        } else {
          trackEl.style.transform = 'translateX(-33.3333%)';
          pendingShift = 0;
        }
      }
      isHorizontal = null;
    });

    trackEl.addEventListener('transitionend', (e)=>{
      if(e.propertyName !== 'transform') return;
      trackEl.classList.remove('animate');
      if(pendingShift !== 0){
        const shift = pendingShift;
        pendingShift = 0;
        onMonthShift(shift);
      }
    });
  }

  const ITEM_H = 44;
  const AMPM_ITEMS = ['오전','오후'];
  const HOUR_ITEMS = Array.from({length:12}, (_,i)=> String(i+1));
  const MIN_ITEMS = Array.from({length:12}, (_,i)=> pad(i*5));

  const ampmWheel = document.getElementById('ampmWheel');

  const minWheel = document.getElementById('minWheel');

  function buildWheelItems(el, labels){
    let html = '<div class="wheel-spacer"></div>';
    labels.forEach(label=>{ html += '<div class="wheel-item">'+label+'</div>'; });
    html += '<div class="wheel-spacer"></div>';
    el.innerHTML = html;
  }
  function getWheelIndex(el, count){
    let idx = Math.round(el.scrollTop / ITEM_H);
    if(idx<0) idx=0;
    if(idx>count-1) idx=count-1;
    return idx;
  }
  function setWheelIndex(el, idx){
    el.scrollTop = idx * ITEM_H;
    highlightWheelItems(el);
  }
  function highlightWheelItems(el){
    const items = el.querySelectorAll('.wheel-item');
    const idx = getWheelIndex(el, items.length);
    items.forEach((item,i)=> item.classList.toggle('active', i===idx));
  }
  buildWheelItems(ampmWheel, AMPM_ITEMS);
  buildWheelItems(hourWheel, HOUR_ITEMS);
  buildWheelItems(minWheel, MIN_ITEMS);

  function getActiveTime(){ return activeTimeTarget==='end' ? modalEndTime : modalTime; }
  function setActiveTime(v){
    if(activeTimeTarget==='end'){ modalEndTime = v; } else { modalTime = v; }
    updateTimeFieldLabel(activeTimeTarget);
  }
  function syncWheelsFromModalTime(){
    const [hh, mm] = getActiveTime().split(':').map(Number);
    const ampmIdx = hh < 12 ? 0 : 1;
    let hour12 = hh % 12; if(hour12===0) hour12 = 12;
    const hourIdx = hour12 - 1;
    const minIdx = Math.max(0, Math.min(11, Math.round(mm/5) % 12));
    setWheelIndex(ampmWheel, ampmIdx);
    setWheelIndex(hourWheel, hourIdx);
    setWheelIndex(minWheel, minIdx);
  }
  function composeTimeFromWheels(){
    const ampmIdx = getWheelIndex(ampmWheel, 2);
    const hourIdx = getWheelIndex(hourWheel, 12);
    const minIdx = getWheelIndex(minWheel, 12);
    const hour12 = hourIdx + 1;
    const hour24 = (hour12 % 12) + (ampmIdx===1 ? 12 : 0);
    setActiveTime(pad(hour24) + ':' + pad(minIdx*5));
  }
  let wheelScrollRAF = null;
  [ampmWheel, hourWheel, minWheel].forEach(w=>{
    w.addEventListener('scroll', ()=>{
      if(wheelScrollRAF) cancelAnimationFrame(wheelScrollRAF);
      wheelScrollRAF = requestAnimationFrame(()=>{
        highlightWheelItems(w);
        composeTimeFromWheels();
      });
    });
  });

  // 탭하면 숫자 직접 입력 (스크롤 드래그 후에는 클릭 이벤트가 발생하지 않아 스크롤과 구분됨)
  function enterTypeMode(wheelEl, inputEl, curVal){
    inputEl.value = curVal;
    wheelEl.classList.add('hidden');
    inputEl.classList.remove('hidden');
    inputEl.focus();
    inputEl.select();
  }
  function exitHourTypeMode(){
    let v = parseInt(hourTypeInput.value, 10);
    if(isNaN(v) || v<1) v = 1;
    if(v>12) v = 12;
    setWheelIndex(hourWheel, v-1);
    composeTimeFromWheels();
    hourTypeInput.classList.add('hidden');
    hourWheel.classList.remove('hidden');
  }
  function exitMinTypeMode(){
    let v = parseInt(minTypeInput.value, 10);
    if(isNaN(v) || v<0) v = 0;
    if(v>59) v = 59;
    // 정확한 분(5분 단위 아니어도) 값을 그대로 반영
    const [hh] = getActiveTime().split(':').map(Number);
    setActiveTime(pad(hh) + ':' + pad(v));
    setWheelIndex(minWheel, Math.round(v/5) % 12);
    minTypeInput.classList.add('hidden');
    minWheel.classList.remove('hidden');
  }
  hourWheel.addEventListener('click', ()=>{
    const idx = getWheelIndex(hourWheel, 12);
    enterTypeMode(hourWheel, hourTypeInput, HOUR_ITEMS[idx]);
  });
  minWheel.addEventListener('click', ()=>{
    const [, mm] = getActiveTime().split(':').map(Number);
    enterTypeMode(minWheel, minTypeInput, pad(mm));
  });
  hourTypeInput.addEventListener('blur', exitHourTypeMode);
  hourTypeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') hourTypeInput.blur(); });
  minTypeInput.addEventListener('blur', exitMinTypeMode);
  minTypeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') minTypeInput.blur(); });

  function renderTimeWheels(){
    hourTypeInput.classList.add('hidden');
    minTypeInput.classList.add('hidden');
    hourWheel.classList.remove('hidden');
    minWheel.classList.remove('hidden');
    syncWheelsFromModalTime();
  }

  function openEditModal(dateKey, ev){
    editingId = ev.id;
    editingOriginalDate = dateKey;
    modalDate = dateKey;
    modalEndDate = ev.endDate || dateKey;
    activeDateTarget = 'start';
    activeTimeTarget = 'start';
    updateDateFieldLabel('start');
    updateDateFieldLabel('end');
    document.getElementById('modalTitle').textContent = '일정 수정';
    selectedWho = ev.who;
    document.querySelectorAll('.who-select button').forEach(b=>b.classList.toggle('active', b.dataset.who===ev.who));
    document.getElementById('titleInput').value = ev.title;
    modalTime = ev.time || '09:00';
    modalEndTime = ev.endTime || modalTime;
    updateTimeFieldLabel('start');
    updateTimeFieldLabel('end');
    document.getElementById('memoInput').value = ev.memo || '';
    document.getElementById('dateInlinePanel').classList.add('hidden');
    document.getElementById('timeInlinePanel').classList.add('hidden');
    modalBg.classList.remove('hidden');
  }

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    try{
      const titleInputEl = document.getElementById('titleInput');
      const title = titleInputEl.value.trim();
      if(!title){
        titleInputEl.focus();
        titleInputEl.style.borderColor = '#FF5F5F';
        setTimeout(()=>{ titleInputEl.style.borderColor = ''; }, 1200);
        return;
      }
      const time = modalTime;
      const memo = document.getElementById('memoInput').value.trim();
      const targetDate = modalDate;
      let endDate = modalEndDate;
      if(parseDateKey(endDate) < parseDateKey(targetDate)) endDate = targetDate;
      const endTime = modalEndTime;

      if(editingId){
        if(editingOriginalDate && editingOriginalDate !== targetDate){
          events[editingOriginalDate] = (events[editingOriginalDate]||[]).filter(x=>x.id!==editingId);
          if(events[editingOriginalDate].length===0) delete events[editingOriginalDate];
        }
        const list = events[targetDate] ? events[targetDate].slice() : [];
        const idx = list.findIndex(x=>x.id===editingId);
        if(idx>-1){
          list[idx] = {...list[idx], who: selectedWho, title, time, memo, endDate, endTime};
        } else {
          list.push({id: editingId, who: selectedWho, title, time, memo, endDate, endTime});
        }
        events[targetDate] = list;
      } else {
        const list = events[targetDate] ? events[targetDate].slice() : [];
        list.push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), who: selectedWho, title, time, memo, endDate, endTime});
        events[targetDate] = list;
      }
      selectedDate = targetDate;
      persist();
      modalBg.classList.add('hidden');
    }catch(err){
      document.getElementById('statusNote').textContent = '저장 중 오류: ' + err.message;
    }
  });

  // ── 연도 선택 팝업 (범용: 콜백으로 어디서 열렸는지 처리) ──
  const yearModalBg = document.getElementById('yearModalBg');
  const yearGrid = document.getElementById('yearGrid');
  const YEAR_MIN = new Date().getFullYear() - 10;
  const YEAR_MAX = new Date().getFullYear() + 30;
  function openYearPicker(currentYear, onSelect){
    yearGrid.innerHTML = '';
    for(let y=YEAR_MIN; y<=YEAR_MAX; y++){
      const btn = document.createElement('button');
      btn.textContent = y;
      if(y===currentYear) btn.classList.add('active');
      btn.addEventListener('click', ()=>{
        yearModalBg.classList.add('hidden');
        onSelect(y);
      });
      yearGrid.appendChild(btn);
    }
    yearModalBg.classList.remove('hidden');
    const activeBtn = yearGrid.querySelector('button.active');
    if(activeBtn) activeBtn.scrollIntoView({block:'center'});
  }
  document.getElementById('yearBtn').addEventListener('click', ()=>{
    openYearPicker(cursor.getFullYear(), (y)=>{
      cursor = new Date(y, cursor.getMonth(), 1);
      render();
    });
  });
  document.getElementById('yearCancelBtn').addEventListener('click', ()=> yearModalBg.classList.add('hidden'));
  yearModalBg.addEventListener('click', (e)=>{ if(e.target===yearModalBg) yearModalBg.classList.add('hidden'); });

  // ── 일정 등록/수정 모달의 날짜/시간 인라인 선택 패널 ──
  const dateInlinePanel = document.getElementById('dateInlinePanel');
  const timeInlinePanel = document.getElementById('timeInlinePanel');
  const dpViewport = document.getElementById('dpViewport');
  const dpTrack = document.getElementById('dpTrack');
  function getActiveDate(){ return activeDateTarget==='end' ? modalEndDate : modalDate; }
  function setActiveDate(dk){
    if(activeDateTarget==='end'){
      modalEndDate = dk;
      if(parseDateKey(modalEndDate) < parseDateKey(modalDate)){
        modalDate = modalEndDate;
        updateDateFieldLabel('start');
      }
    } else {
      modalDate = dk;
      if(parseDateKey(modalEndDate) < parseDateKey(modalDate)){
        modalEndDate = modalDate;
        updateDateFieldLabel('end');
      }
    }
    updateDateFieldLabel(activeDateTarget);
  }
  function onPickerDayClick(dateObj, dk){
    setActiveDate(dk);
    dateInlinePanel.classList.add('hidden');
  }
  function renderDatePicker(){
    const year = pickerCursor.getFullYear();
    const month = pickerCursor.getMonth();
    document.getElementById('dpMonthNum').textContent = month+1;
    document.getElementById('dpYearNum').textContent = year;
    const todayKey = keyFor(new Date());
    const activeDate = getActiveDate();
    buildMonthGrid(document.getElementById('dpGridPrev'), year, month-1, todayKey, activeDate, onPickerDayClick, DP_HEIGHT);
    buildMonthGrid(document.getElementById('dpGridCur'), year, month, todayKey, activeDate, onPickerDayClick, DP_HEIGHT);
    buildMonthGrid(document.getElementById('dpGridNext'), year, month+1, todayKey, activeDate, onPickerDayClick, DP_HEIGHT);
    dpTrack.classList.remove('animate');
    dpTrack.style.transform = 'translateX(-33.3333%)';
  }
  setupMonthSwipe(dpViewport, dpTrack, (shift)=>{
    pickerCursor = new Date(pickerCursor.getFullYear(), pickerCursor.getMonth()+shift, 1);
    renderDatePicker();
  });
  function openDatePanel(target){
    const opening = dateInlinePanel.classList.contains('hidden') || activeDateTarget!==target;
    timeInlinePanel.classList.add('hidden');
    activeDateTarget = target;
    if(opening){
      pickerCursor = parseDateKey(getActiveDate());
      renderDatePicker();
      dateInlinePanel.classList.remove('hidden');
    } else {
      dateInlinePanel.classList.add('hidden');
    }
  }
  function openTimePanel(target){
    const opening = timeInlinePanel.classList.contains('hidden') || activeTimeTarget!==target;
    dateInlinePanel.classList.add('hidden');
    activeTimeTarget = target;
    if(opening){
      renderTimeWheels();
      timeInlinePanel.classList.remove('hidden');
    } else {
      timeInlinePanel.classList.add('hidden');
    }
  }
  document.getElementById('dateFieldBtn').addEventListener('click', ()=> openDatePanel('start'));
  document.getElementById('endDateFieldBtn').addEventListener('click', ()=> openDatePanel('end'));
  document.getElementById('timeFieldBtn').addEventListener('click', ()=> openTimePanel('start'));
  document.getElementById('endTimeFieldBtn').addEventListener('click', ()=> openTimePanel('end'));
  document.getElementById('dpPrev').addEventListener('click', ()=>{
    pickerCursor = new Date(pickerCursor.getFullYear(), pickerCursor.getMonth()-1, 1);
    renderDatePicker();
  });
  document.getElementById('dpNext').addEventListener('click', ()=>{
    pickerCursor = new Date(pickerCursor.getFullYear(), pickerCursor.getMonth()+1, 1);
    renderDatePicker();
  });
  document.getElementById('dpYearBtn').addEventListener('click', ()=>{
    openYearPicker(pickerCursor.getFullYear(), (y)=>{
      pickerCursor = new Date(y, pickerCursor.getMonth(), 1);
      renderDatePicker();
    });
  });

  initData();
</script>
</body>
</html>
